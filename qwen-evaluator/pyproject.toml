[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "qwen-inference-lab-evaluator"
version = "0.1.0"
description = "Auditable math evaluation components for QwenInferenceLab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "math-verify[antlr4_13_2]==0.9.0",
  "pymongo>=4.10,<5",
  "python-dotenv>=1.0,<2",
  "pydantic>=2,<3",
  "openai>=1,<3",
  "httpx[socks]>=0.27,<1",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-mock>=3.14,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_inference_lab"]
